        <text x="500" y="188" fill="#94a3b8" font-size="9" text-anchor="middle">L7 · TLS term · rate limit</text>
        <text x="500" y="201" fill="#fbbf24" font-size="8" text-anchor="middle">peak ~3 req/s — trivial load</text>

        <rect x="95" y="252" width="174" height="58" rx="6" fill="#0f172a"/>
        <rect x="95" y="252" width="174" height="58" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
