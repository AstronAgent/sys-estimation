<svg xmlns="http://www.w3.org/2000/svg" width="1032" height="852" viewBox="-16 -16 1032 852" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &quot;DejaVu Sans Mono&quot;, monospace">
  <title>Fig. 1 — Live production request path (AWS)</title>
  <rect x="-16" y="-16" width="1032" height="852" fill="#020617"/>

        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
          </marker>
          <marker id="arrowstart" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
            <polygon points="10 0, 0 3.5, 10 7" fill="#64748b" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- ============ BOUNDARIES ============ -->
        <rect x="35" y="112" width="935" height="685" rx="12" fill="rgba(251,191,36,0.04)" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
        <text x="48" y="131" fill="#fbbf24" font-size="10" font-weight="600">AWS VPC — private subnets, no public GPU ingress</text>

        <rect x="45" y="588" width="310" height="155" rx="8" fill="transparent" stroke="#fb7185" stroke-width="1" stroke-dasharray="4,4"/>
        <text x="56" y="606" fill="#fb7185" font-size="8">sg-inference :30000 — orchestrator only · p5e.48xlarge</text>

        <rect x="600" y="482" width="350" height="200" rx="8" fill="transparent" stroke="#fb7185" stroke-width="1" stroke-dasharray="4,4"/>
        <text x="612" y="500" fill="#fb7185" font-size="8">sg-tools — per-tool scoped tokens (no shared superuser cred)</text>

        <rect x="600" y="700" width="350" height="80" rx="8" fill="rgba(100,116,139,0.06)" stroke="#64748b" stroke-width="1" stroke-dasharray="6,3"/>
        <text x="612" y="716" fill="#94a3b8" font-size="8" font-weight="600">OFFLINE / SCHEDULED — never on the request path</text>

        <!-- ============ ARROWS ============ -->
        <line x1="500" y1="90" x2="500" y2="146" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="512" y="122" fill="#94a3b8" font-size="9">① HTTPS / SSE stream</text>

        <line x1="500" y1="208" x2="500" y2="248" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="512" y="232" fill="#94a3b8" font-size="9">②</text>

        <line x1="403" y1="281" x2="269" y2="281" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
        <text x="336" y="273" fill="#fb7185" font-size="8" text-anchor="middle">③ verify JWT</text>

        <line x1="597" y1="281" x2="731" y2="281" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="664" y="273" fill="#94a3b8" font-size="8" text-anchor="middle">④ session state</text>

        <line x1="500" y1="310" x2="500" y2="320" stroke="#fb923c" stroke-width="1.5"/>
        <line x1="500" y1="346" x2="500" y2="369" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="600" y="340" fill="#fb923c" font-size="8">⑤ async dispatch (SQS)</text>

        <path d="M 318 415 L 252 415 Q 232 415 232 435 L 232 494" fill="none" stroke="#34d399" stroke-width="1.5"
              marker-end="url(#arrowhead)" marker-start="url(#arrowstart)"/>
        <text x="245" y="478" fill="#34d399" font-size="9">⑥ agentic loop · 2–6 passes/conv</text>

        <line x1="200" y1="556" x2="200" y2="580" stroke="#fbbf24" stroke-width="1.5"/>
        <line x1="106" y1="580" x2="302" y2="580" stroke="#fbbf24" stroke-width="1.5"/>
        <line x1="106" y1="580" x2="106" y2="612" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <line x1="204" y1="580" x2="204" y2="612" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <line x1="302" y1="580" x2="302" y2="612" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="316" y="573" fill="#94a3b8" font-size="8">⑦ least-outstanding + prefix affinity</text>

        <path d="M 682 400 L 720 400 Q 740 400 740 420 L 740 478" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="750" y="438" fill="#a78bfa" font-size="9">⑧ MCP tool calls</text>

        <!-- offline producers feeding the tool tier -->
        <line x1="694" y1="720" x2="694" y2="668" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
        <line x1="864" y1="720" x2="864" y2="668" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>

        <!-- ============ COMPONENTS ============ -->

        <rect x="410" y="38" width="180" height="52" rx="6" fill="#0f172a"/>
        <rect x="410" y="38" width="180" height="52" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="500" y="60" fill="white" font-size="11" font-weight="600" text-anchor="middle">End Users</text>
        <text x="500" y="78" fill="#94a3b8" font-size="9" text-anchor="middle">3k DAU · ~750 concurrent sessions</text>

        <rect x="395" y="150" width="210" height="58" rx="6" fill="#0f172a"/>
        <rect x="395" y="150" width="210" height="58" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
