        <text x="501" y="290" fill="#94a3b8" font-size="9" text-anchor="middle">SSE stream — TTFT &lt; 3 s</text>
        <text x="501" y="303" fill="#34d399" font-size="8" text-anchor="middle">2–4× m7g.xlarge (autoscaled)</text>

        <rect x="731" y="252" width="174" height="58" rx="6" fill="#0f172a"/>
        <rect x="731" y="252" width="174" height="58" rx="6" fill="rgba(8,51,68,0.4)" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="818" y="274" fill="white" font-size="11" font-weight="600" text-anchor="middle">ElastiCache Redis</text>
        <text x="818" y="290" fill="#94a3b8" font-size="9" text-anchor="middle">sessions · tool-call state</text>
        <text x="818" y="303" fill="#38bdf8" font-size="8" text-anchor="middle">~150 MB · cache.r7g.large + replica</text>

        <rect x="420" y="322" width="160" height="24" rx="4" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
        <text x="500" y="338" fill="#fb923c" font-size="8" text-anchor="middle">SQS async task queue</text>

        <rect x="320" y="372" width="362" height="86" rx="6" fill="#0f172a"/>
        <rect x="320" y="372" width="362" height="86" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="501" y="395" fill="white" font-size="12" font-weight="600" text-anchor="middle">MCP Graph Orchestrator</text>
        <text x="501" y="412" fill="#94a3b8" font-size="9" text-anchor="middle">tools as graph nodes · independent edges dispatched in parallel</text>
        <text x="501" y="427" fill="#fb7185" font-size="9" text-anchor="middle">guards: 6-iteration cap + token budget + 6 s wall-clock deadline</text>
        <text x="501" y="446" fill="#34d399" font-size="8" text-anchor="middle">3× m7g.2xlarge (8 vCPU / 32 GB) — holds the loop, not the GPU</text>

        <rect x="95" y="498" width="210" height="58" rx="6" fill="#0f172a"/>
        <rect x="95" y="498" width="210" height="58" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
