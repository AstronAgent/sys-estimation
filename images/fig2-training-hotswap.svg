<svg xmlns="http://www.w3.org/2000/svg" width="1032" height="592" viewBox="-16 -16 1032 592" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &quot;DejaVu Sans Mono&quot;, monospace">
  <title>Fig. 2 — Training, gated hot-swap, and the scheduled ML track</title>
  <rect x="-16" y="-16" width="1032" height="592" fill="#020617"/>

        <defs>
          <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
          </marker>
          <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="url(#grid2)" />

        <rect x="722" y="108" width="245" height="278" rx="10" fill="rgba(251,113,133,0.04)" stroke="#fb7185" stroke-width="1" stroke-dasharray="4,4"/>
        <text x="734" y="126" fill="#fb7185" font-size="8" font-weight="600">PROMOTION GATE — no direct RL → prod path</text>

        <rect x="150" y="412" width="560" height="118" rx="10" fill="rgba(100,116,139,0.06)" stroke="#64748b" stroke-width="1" stroke-dasharray="6,3"/>
        <text x="163" y="430" fill="#94a3b8" font-size="8" font-weight="600">OFFLINE / SCHEDULED TRACK — runs on a fixed frequency, never on the request path</text>

        <!-- Arrows -->
        <line x1="220" y1="176" x2="262" y2="176" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowhead2)"/>
        <text x="241" y="168" fill="#94a3b8" font-size="8" text-anchor="middle">①</text>

        <line x1="450" y1="176" x2="492" y2="176" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowhead2)"/>
        <text x="471" y="168" fill="#94a3b8" font-size="8" text-anchor="middle">②</text>

        <line x1="680" y1="176" x2="736" y2="176" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead2)"/>
        <text x="708" y="168" fill="#94a3b8" font-size="8" text-anchor="middle">③</text>

        <line x1="845" y1="222" x2="845" y2="292" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrowhead2)"/>
        <text x="856" y="262" fill="#94a3b8" font-size="8">④ eval</text>

        <line x1="756" y1="332" x2="664" y2="332" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowhead2)"/>
        <text x="710" y="324" fill="#34d399" font-size="8" text-anchor="middle">⑤ promote</text>

        <path d="M 388 336 L 330 336 Q 314 336 314 320 L 314 228" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrowhead2)"/>
        <text x="45" y="340" fill="#94a3b8" font-size="9">⑥ prod traces + reward signal → RL replay buffer</text>

        <line x1="404" y1="474" x2="456" y2="474" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead2)"/>
        <text x="430" y="466" fill="#94a3b8" font-size="8" text-anchor="middle">⑦</text>

        <!-- Row 1 -->
        <rect x="35" y="130" width="185" height="92" rx="6" fill="#0f172a"/>
        <rect x="35" y="130" width="185" height="92" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="127" y="153" fill="white" font-size="11" font-weight="600" text-anchor="middle">1. Pre-training</text>
        <text x="127" y="171" fill="#94a3b8" font-size="8" text-anchor="middle">LoRA continued / domain-adaptive</text>
        <text x="127" y="185" fill="#34d399" font-size="8" text-anchor="middle">~66 GB → fits 1× H200 or B200</text>
        <text x="127" y="199" fill="#94a3b8" font-size="8" text-anchor="middle">H200 ~1.9B tok/day · B200 ~4.3B</text>
        <text x="127" y="215" fill="#fb7185" font-size="8" text-anchor="middle">from scratch: 1.3–2.9 yr — no</text>

        <rect x="265" y="130" width="185" height="92" rx="6" fill="#0f172a"/>
        <rect x="265" y="130" width="185" height="92" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="357" y="153" fill="white" font-size="11" font-weight="600" text-anchor="middle">2. Post-training (RL)</text>
        <text x="357" y="171" fill="#94a3b8" font-size="8" text-anchor="middle">GRPO · LoRA · ref model is free</text>
        <text x="357" y="185" fill="#34d399" font-size="8" text-anchor="middle">~66 GB → spare H200 on the p5e</text>
        <text x="357" y="199" fill="#94a3b8" font-size="8" text-anchor="middle">~600–1,200 steps/day · 2× headroom</text>
        <text x="357" y="215" fill="#fb7185" font-size="8" text-anchor="middle">full-param ~520 GB — will not fit</text>

        <rect x="495" y="130" width="185" height="92" rx="6" fill="#0f172a"/>
        <rect x="495" y="130" width="185" height="92" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
        <text x="587" y="153" fill="white" font-size="11" font-weight="600" text-anchor="middle">3. Model Registry</text>
        <text x="587" y="171" fill="#94a3b8" font-size="8" text-anchor="middle">S3 · versioned, immutable</text>
        <text x="587" y="185" fill="#94a3b8" font-size="8" text-anchor="middle">35 GB (FP8) per checkpoint</text>
        <text x="587" y="204" fill="#a78bfa" font-size="8" text-anchor="middle">retain 50 → ~2 TB</text>

        <rect x="740" y="130" width="210" height="92" rx="6" fill="#0f172a"/>
        <rect x="740" y="130" width="210" height="92" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="845" y="153" fill="white" font-size="11" font-weight="600" text-anchor="middle">4. Production Testing</text>
        <text x="845" y="171" fill="#94a3b8" font-size="8" text-anchor="middle">SGLang canary · shadow traffic</text>
        <text x="845" y="185" fill="#94a3b8" font-size="8" text-anchor="middle">1 GPU on the same p5e.48xlarge</text>
        <text x="845" y="204" fill="#34d399" font-size="8" text-anchor="middle">must be H200 — L40S/L4 cannot</text>
        <text x="845" y="216" fill="#34d399" font-size="8" text-anchor="middle">reproduce production latency</text>

        <!-- Row 2 -->
        <rect x="760" y="294" width="170" height="72" rx="6" fill="#0f172a"/>
        <rect x="760" y="294" width="170" height="72" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
        <text x="845" y="315" fill="white" font-size="10" font-weight="600" text-anchor="middle">Automated Eval Gate</text>
        <text x="845" y="331" fill="#94a3b8" font-size="8" text-anchor="middle">safety · regression · task acc</text>
        <text x="845" y="344" fill="#94a3b8" font-size="8" text-anchor="middle">p99 vs the 8 s SLA · tool validity</text>
        <text x="845" y="360" fill="#fb7185" font-size="8" text-anchor="middle">fail → block + auto-rollback</text>

        <rect x="390" y="294" width="272" height="82" rx="6" fill="#0f172a"/>
        <rect x="390" y="294" width="272" height="82" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="526" y="317" fill="white" font-size="11" font-weight="600" text-anchor="middle">5. Live SGLang Fleet  (Fig. 1)</text>
        <text x="526" y="335" fill="#94a3b8" font-size="8" text-anchor="middle">hot-swap: update_weights_from_disk</text>
        <text x="526" y="349" fill="#94a3b8" font-size="8" text-anchor="middle">in-place, connections held open</text>
        <text x="526" y="367" fill="#fbbf24" font-size="8" text-anchor="middle">fallback: blue/green drain via inference LB</text>

        <!-- Row 3: scheduled ML track -->
        <rect x="175" y="440" width="229" height="68" rx="6" fill="#0f172a"/>
        <rect x="175" y="440" width="229" height="68" rx="6" fill="rgba(30,41,59,0.6)" stroke="#64748b" stroke-width="1.5"/>
        <text x="289" y="462" fill="white" font-size="10" font-weight="600" text-anchor="middle">Dedicated ML Model</text>
        <text x="289" y="478" fill="#94a3b8" font-size="8" text-anchor="middle">EventBridge schedule · Spot-eligible</text>
        <text x="289" y="496" fill="#94a3b8" font-size="8" text-anchor="middle">g6.4xlarge — 16 vCPU / 64 GB / 24 GB VRAM</text>

        <rect x="456" y="440" width="229" height="68" rx="6" fill="#0f172a"/>
        <rect x="456" y="440" width="229" height="68" rx="6" fill="rgba(8,51,68,0.4)" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="570" y="462" fill="white" font-size="10" font-weight="600" text-anchor="middle">ML Result Cache</text>
        <text x="570" y="478" fill="#94a3b8" font-size="8" text-anchor="middle">DynamoDB + native TTL</text>
        <text x="570" y="496" fill="#38bdf8" font-size="8" text-anchor="middle">→ read by MCP tool in Fig. 1 (~ms)</text>

        <text x="722" y="478" fill="#94a3b8" font-size="8">Open: run frequency,</text>
        <text x="722" y="491" fill="#94a3b8" font-size="8">max staleness, miss policy</text>
      </svg>
